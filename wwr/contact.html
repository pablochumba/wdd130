<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Us | Dry Oar Rafting</title>
    <meta name="description"
      content="Meet Dry Oar Rafting. Learn our story, our guides, and how we deliver safe, unforgettable whitewater adventures.">
    <meta name="author" content="Pablo Chumba">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <a id="logo_link" href="index.html">
            <img class="logo" src="images/logo.png" alt="Dry Oar Rafting logo">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-header">
            <h1>Contact Deepwater Rafting Club</h1>
            <p>
                123 Main River Street<br />
                Rancagua, Chile<br />
                +56 9 9999 9999<br />
                <a href="mailto:info@deepwaterrafting.com">info@deepwaterrafting.com</a>
            </p>
        </section>

        <div class="contact-grid">
            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3327.383273515081!2d-70.74683168479383!3d-34.17013268057469!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x96636b596b865edb%3A0x1b2e3bdb4dd39113!2sRancagua%2C%20O%E2%80%99Higgins%2C%20Chile!5e0!3m2!1sen!2scl!4v1728523456789!5m2!1sen!2scl"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="contact-card">
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your name..." required />

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your email..."
                      required />

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <div class="contact-radios">
                            <label for="purpose-inquiry">
                                <input type="radio" id="purpose-inquiry" name="purpose"
                                  value="inquiry" required />
                                General Inquiry
                            </label>

                            <label for="purpose-reservation">
                                <input type="radio" id="purpose-reservation" name="purpose"
                                  value="reservation" />
                                Reservation Question
                            </label>

                            <label for="purpose-suggestion">
                                <input type="radio" id="purpose-suggestion" name="purpose"
                                  value="suggestion" />
                                Website Suggestion
                            </label>
                        </div>
                    </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here..."></textarea>

                    <label for="subscribe" class="contact-newsletter">
                        <input type="checkbox" id="subscribe" name="subscribe" />
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>
        <section class="team-section">
            <h2>We Are Here to Serve You!</h2>

            <div class="team-grid">
                <figure>
                    <img src="./images/employee1.webp" alt="Employee 1" />
                    <figcaption>Laura Mendoza — Customer Experience</figcaption>

                </figure>

                <figure>
                    <img src="./images/employee2.webp" alt="Employee 2" />
                    <figcaption>Daniel Rivero — Lead River Guide</figcaption>

                </figure>

                <figure>
                    <img src="./images/employee3.webp" alt="Employee 3" />
                    <figcaption>Tomás Aguilar — Safety Specialist</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>Dry Oar &copy; 2026 - Pablo Chumba</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>

            <a href="https://twitter.com" target="_blank" rel="noopener">
                <img src="images/x-icon.png" alt="X social media icon">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram-icon.png" alt="Instagram icon">
            </a>
        </nav>

    </footer>
</body>

</html>
